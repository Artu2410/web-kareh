<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel administrativo | Kareh</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin-shell"><header class="admin-header"><div><a href="../obras-sociales/">← Obras sociales públicas</a><h1>Panel de obras sociales</h1></div><button id="logout" class="secondary">Cerrar sesión</button></header><section class="admin-grid" aria-label="Resumen"><div class="stat">Total<strong id="total">—</strong></div><div class="stat">Activas<strong id="active-total">—</strong></div><div class="stat">Inactivas<strong id="inactive-total">—</strong></div></section><section class="admin-card"><div class="toolbar"><input id="search" type="search" placeholder="Buscar obra social…"><button id="new-coverage">+ Agregar obra social</button></div><p id="message" class="error" aria-live="polite"></p><form id="coverage-form" class="hidden"><h2 id="form-title">Nueva obra social</h2><input id="coverage-id" type="hidden"><div class="form-grid"><div><label>Nombre<input id="name" required maxlength="120"></label></div><div><label>Estado<select id="active"><option value="true">Activa</option><option value="false">Inactiva</option></select></label></div><div><label>URL del logo (opcional)<input id="logo_url" type="url" placeholder="https://…"></label></div><div><label>Subir logo propio (opcional)<input id="logo_file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><small>PNG, JPG, WebP o SVG, hasta 2 MB.</small></label></div><div><label>Web oficial (opcional)<input id="official_url" type="url" placeholder="https://…"></label></div></div><label>Descripción corta (opcional)<textarea id="description" maxlength="300"></textarea></label><p><button type="submit">Guardar</button> <button id="cancel" class="secondary" type="button">Cancelar</button></p></form><div id="coverage-list" class="coverage-list" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase-config.js"></script><script src="admin.js"></script></body></html>
