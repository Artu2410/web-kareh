<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ingreso administrativo | Kareh</title><link rel="stylesheet" href="../admin.css"></head><body><main class="admin-shell" style="max-width:500px"><section class="admin-card"><a href="../../">← Volver al sitio</a><h1>Ingreso administrativo</h1><p>Gestión de obras sociales Kareh.</p><p id="message" class="error" aria-live="polite"></p><form id="login-form"><label for="username">Usuario</label><input id="username" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">Iniciar sesión</button></p></form><p><button id="reset" class="secondary" type="button">¿Olvidaste tu contraseña?</button></p><form id="new-password-form" class="hidden"><h2>Nueva contraseña</h2><label for="new-password">Elegí una nueva contraseña</label><input id="new-password" type="password" minlength="12" autocomplete="new-password" required><p><button type="submit">Actualizar contraseña</button></p></form><p class="notice">Por seguridad, el enlace de recuperación se enviará al correo administrativo si corresponde.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/supabase-config.js"></script><script src="../admin.js"></script></body></html>
